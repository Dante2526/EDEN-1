    <script>
      (function () {
        try {
          var t = localStorage.getItem('synap_theme') === 'light' ? 'light' : 'dark';
          var d = document.documentElement;
          d.classList.toggle('dark', t === 'dark');
          d.style.colorScheme = t;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#111217' : '#ffffff');
        } catch (e) {}
      })();
    </script>
