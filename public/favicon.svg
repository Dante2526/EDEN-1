<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de Fundo Zen do Éden -->
    <linearGradient id="edenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1815" />
      <stop offset="100%" stop-color="#0d0c0a" />
    </linearGradient>

    <!-- Sol Zen / Ensō Terracota Éden -->
    <radialGradient id="zenSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97757" stop-opacity="0.38" />
      <stop offset="65%" stop-color="#d97757" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#d97757" stop-opacity="0" />
    </radialGradient>

    <!-- Folhagens do Bonsai (Verde Jade / Esmeralda Zen) -->
    <linearGradient id="foliageGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="foliageGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <!-- Tronco do Bonsai (Madeira Nobre e Curvatura Sinuosa) -->
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c48b71" />
      <stop offset="40%" stop-color="#8b5742" />
      <stop offset="100%" stop-color="#4a2818" />
    </linearGradient>

    <!-- Vaso Cerâmico Japonês Tradicional (Hachi) -->
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a332c" />
      <stop offset="50%" stop-color="#24201b" />
      <stop offset="100%" stop-color="#14120f" />
    </linearGradient>
  </defs>

  <!-- Fundo Arredondado Escuro Premium -->
  <rect width="512" height="512" rx="128" fill="url(#edenBg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#d97757" stroke-width="4" stroke-opacity="0.35" />

  <!-- Círculo Zen / Solstício Éden de Fundo -->
  <circle cx="260" cy="220" r="140" fill="url(#zenSun)" />
  <circle cx="260" cy="220" r="120" fill="none" stroke="#d97757" stroke-width="2.5" stroke-opacity="0.25" stroke-dasharray="12 6" />

  <!-- Vaso Raso de Bonsai Japonês com Pés -->
  <!-- Base do Vaso -->
  <path d="M 170 410 L 342 410 C 347 410 351 406 350 401 L 342 360 C 341 356 337 353 333 353 L 179 353 C 175 353 171 356 170 360 L 162 401 C 161 406 165 410 170 410 Z" fill="url(#potGrad)" stroke="#453d35" stroke-width="3" />
  <!-- Borda do Vaso -->
  <rect x="156" y="347" width="200" height="12" rx="4" fill="#3f3830" stroke="#524a40" stroke-width="2" />
  <!-- Pés do Vaso -->
  <rect x="180" y="410" width="22" height="8" rx="2" fill="#25211c" />
  <rect x="310" y="410" width="22" height="8" rx="2" fill="#25211c" />
  <!-- Terra / Musgo na Borda -->
  <ellipse cx="256" cy="351" rx="85" ry="5" fill="#047857" opacity="0.6" />

  <!-- Tronco Sinuoso do Bonsai Japonês (Estilo Moyogi) -->
  <path d="M 235 352
           C 240 330, 230 300, 245 270
           C 255 250, 275 240, 270 210
           C 265 185, 245 180, 252 150
           C 254 140, 258 135, 260 130
           C 264 135, 268 142, 265 152
           C 258 178, 280 182, 286 208
           C 292 235, 275 250, 264 275
           C 252 302, 266 330, 260 352
           Z" fill="url(#trunkGrad)" />

  <!-- Galho Direito Inferior -->
  <path d="M 252 265
           C 275 262, 310 270, 340 255
           C 344 253, 340 248, 335 250
           C 310 260, 280 252, 260 256
           Z" fill="url(#trunkGrad)" />

  <!-- Galho Esquerdo Médio -->
  <path d="M 258 220
           C 230 215, 195 210, 165 225
           C 160 227, 163 232, 168 230
           C 195 220, 225 223, 250 230
           Z" fill="url(#trunkGrad)" />

  <!-- Galho Direito Superior -->
  <path d="M 268 175
           C 290 165, 315 170, 335 155
           C 338 153, 335 148, 330 150
           C 312 160, 290 155, 265 165
           Z" fill="url(#trunkGrad)" />

  <!-- Nuvem de Folhas 1: Esquerda Média -->
  <g>
    <ellipse cx="165" cy="225" rx="55" ry="24" fill="#064e3b" />
    <ellipse cx="145" cy="222" rx="35" ry="18" fill="#047857" />
    <ellipse cx="180" cy="222" rx="38" ry="18" fill="#047857" />
    <ellipse cx="165" cy="218" rx="48" ry="18" fill="url(#foliageGrad1)" />
    <ellipse cx="150" cy="214" rx="28" ry="13" fill="url(#foliageGrad2)" />
    <ellipse cx="180" cy="215" rx="30" ry="13" fill="url(#foliageGrad2)" />
  </g>

  <!-- Nuvem de Folhas 2: Direita Inferior -->
  <g>
    <ellipse cx="340" cy="255" rx="58" ry="24" fill="#064e3b" />
    <ellipse cx="320" cy="252" rx="38" ry="18" fill="#047857" />
    <ellipse cx="360" cy="252" rx="40" ry="18" fill="#047857" />
    <ellipse cx="340" cy="248" rx="50" ry="18" fill="url(#foliageGrad1)" />
    <ellipse cx="325" cy="244" rx="30" ry="13" fill="url(#foliageGrad2)" />
    <ellipse cx="355" cy="245" rx="32" ry="13" fill="url(#foliageGrad2)" />
  </g>

  <!-- Nuvem de Folhas 3: Direita Média/Superior -->
  <g>
    <ellipse cx="330" cy="155" rx="50" ry="22" fill="#064e3b" />
    <ellipse cx="312" cy="152" rx="32" ry="16" fill="#047857" />
    <ellipse cx="348" cy="152" rx="34" ry="16" fill="#047857" />
    <ellipse cx="330" cy="148" rx="42" ry="16" fill="url(#foliageGrad1)" />
    <ellipse cx="318" cy="145" rx="25" ry="12" fill="url(#foliageGrad2)" />
    <ellipse cx="342" cy="146" rx="26" ry="12" fill="url(#foliageGrad2)" />
  </g>

  <!-- Nuvem de Folhas 4: Copa Principal Superior (Topo Central) -->
  <g>
    <ellipse cx="260" cy="115" rx="75" ry="30" fill="#064e3b" />
    <ellipse cx="225" cy="112" rx="45" ry="22" fill="#047857" />
    <ellipse cx="295" cy="112" rx="48" ry="22" fill="#047857" />
    <ellipse cx="260" cy="106" rx="65" ry="24" fill="url(#foliageGrad1)" />
    <ellipse cx="235" cy="101" rx="38" ry="16" fill="url(#foliageGrad2)" />
    <ellipse cx="285" cy="102" rx="40" ry="16" fill="url(#foliageGrad2)" />
    <ellipse cx="260" cy="95" rx="28" ry="12" fill="#a7f3d0" opacity="0.6" />
  </g>

  <!-- Ponto Zen de Iluminação -->
  <circle cx="260" cy="85" r="3.5" fill="#ffffff" opacity="0.85" />
  <circle cx="355" cy="235" r="2.5" fill="#ffffff" opacity="0.65" />
  <circle cx="150" cy="205" r="2.5" fill="#ffffff" opacity="0.65" />
</svg>
